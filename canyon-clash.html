<title>Canyon Clash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@500;700&display=swap">
<style>
  :root{
    --cyan:#2fe6f6; --cyan-deep:#0bb6d6;
    --gold:#ffcf47; --gold-deep:#e0a022;
    --red:#ff4b57; --sand:#e9c07a;
    --ink:#1a0f08; --panel:rgba(24,12,6,.62);
    --stroke:rgba(255,214,120,.35);
    font-family:'Rubik',system-ui,sans-serif;
  }
  html,body{height:100%;margin:0;background:#0d0805;overflow:hidden;color:#fff;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #stage{position:fixed;inset:0;display:grid;place-items:center;background:
    radial-gradient(120% 90% at 50% 12%, #3a2410 0%, #17100a 55%, #0b0704 100%);}
  #frame{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;touch-action:none;}

  /* ---- HUD ---- */
  .hud{position:absolute;left:0;right:0;top:0;padding:14px 12px 0;
    display:flex;gap:8px;align-items:flex-start;justify-content:space-between;
    pointer-events:none;font-family:'Fredoka',sans-serif;}
  .pill{background:var(--panel);border:1.5px solid var(--stroke);border-radius:16px;
    padding:7px 12px;display:flex;align-items:center;gap:7px;backdrop-filter:blur(6px);
    box-shadow:0 4px 14px rgba(0,0,0,.35);line-height:1;}
  .pill .ic{width:16px;height:16px;border-radius:50%;flex:none;}
  .pill b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px;}
  .pill.crowd{color:#dffbff;} .pill.crowd .ic{background:radial-gradient(circle at 35% 30%,#bff6ff,var(--cyan-deep));box-shadow:0 0 10px var(--cyan);}
  .pill.coins{color:#fff2c9;} .pill.coins .ic{background:radial-gradient(circle at 35% 30%,#fff0b8,var(--gold-deep));box-shadow:0 0 10px var(--gold);}
  .rightcol{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .pill.dist{color:#ffe3c2;font-size:13px;padding:6px 11px;}
  .pill.dist b{font-size:16px;}
  #autoBtn{pointer-events:auto;cursor:pointer;background:var(--panel);border:1.5px solid var(--stroke);
    color:#ffe3c2;border-radius:14px;padding:7px 11px;font-family:'Fredoka',sans-serif;font-weight:600;
    font-size:12px;letter-spacing:1px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(6px);}
  #autoBtn .dot{width:8px;height:8px;border-radius:50%;background:#6b5a45;transition:.2s;}
  #autoBtn.on{color:#062;border-color:var(--cyan);background:rgba(11,182,214,.22);}
  #autoBtn.on .dot{background:var(--cyan);box-shadow:0 0 10px var(--cyan);}

  /* boss bar */
  #bossWrap{position:absolute;left:12px;right:12px;top:64px;display:none;font-family:'Fredoka',sans-serif;}
  #bossWrap.show{display:block;}
  #bossWrap .lab{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;
    color:#ffd9a0;margin-bottom:4px;text-shadow:0 1px 3px #000;}
  #bossBarBg{height:12px;background:rgba(20,8,4,.7);border:1.5px solid var(--stroke);border-radius:9px;overflow:hidden;}
  #bossBar{height:100%;width:100%;border-radius:7px;background:linear-gradient(90deg,#ff9d2f,#ff3b47);transition:width .12s;}

  /* toast */
  #toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:44px;color:#fff;opacity:0;
    text-shadow:0 3px 0 var(--gold-deep),0 0 24px var(--gold);pointer-events:none;white-space:nowrap;}

  /* overlays */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:24px;gap:14px;
    background:radial-gradient(120% 80% at 50% 30%, rgba(28,16,8,.35), rgba(10,6,3,.86));
    backdrop-filter:blur(3px);font-family:'Fredoka',sans-serif;z-index:5;}
  .screen[hidden]{display:none;}
  .kicker{font-size:13px;letter-spacing:5px;color:var(--gold);font-weight:600;text-transform:uppercase;}
  .title{font-size:clamp(40px,13vw,72px);font-weight:700;line-height:.92;margin:0;
    background:linear-gradient(180deg,#fff,#ffd98a);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 6px 30px rgba(255,180,60,.25);}
  .sub{max-width:30ch;color:#f0dcc2;font-family:'Rubik',sans-serif;font-size:14px;line-height:1.5;opacity:.9;}
  .btn{pointer-events:auto;cursor:pointer;border:none;border-radius:18px;padding:16px 30px;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:20px;letter-spacing:.5px;
    color:#04252b;background:linear-gradient(180deg,#7ff0ff,#12b6d6);
    box-shadow:0 8px 0 #0a7f96,0 14px 24px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s;}
  .btn:active{transform:translateY(5px);box-shadow:0 3px 0 #0a7f96,0 6px 14px rgba(0,0,0,.4);}
  .btn.ghost{color:#ffe3c2;background:linear-gradient(180deg,#4a3320,#2c1d10);box-shadow:0 7px 0 #1a1109,0 12px 20px rgba(0,0,0,.4);font-size:15px;padding:12px 22px;}
  .btn.ghost:active{box-shadow:0 2px 0 #1a1109;transform:translateY(5px);}
  .stat{display:flex;gap:26px;margin-top:2px;}
  .stat div{display:flex;flex-direction:column;gap:2px;}
  .stat b{font-size:30px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;}
  .stat span{font-size:11px;letter-spacing:2px;color:#c9b193;text-transform:uppercase;}
  .hint{font-family:'Rubik',sans-serif;font-size:12px;color:#caa;opacity:.75;margin-top:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

<div id="stage">
  <div id="frame">
    <!-- canvas injected here -->
    <div class="hud">
      <div class="pill crowd"><span class="ic"></span><b id="crowd">1</b></div>
      <div class="rightcol">
        <div class="pill coins"><span class="ic"></span><b id="coins">0</b></div>
        <button id="autoBtn" aria-pressed="false"><span class="dot"></span>AUTO</button>
        <div class="pill dist">▲ <b id="dist">0</b>m</div>
      </div>
    </div>
    <div id="bossWrap"><div class="lab"><span>⬢ GOLD SCORPION</span><span id="bossPct">100%</span></div>
      <div id="bossBarBg"><div id="bossBar"></div></div></div>
    <div id="toast"></div>

    <div class="screen" id="startScreen">
      <div class="kicker">Hyper-Runner</div>
      <h1 class="title">CANYON<br>CLASH</h1>
      <p class="sub">Steer your squad through the <b style="color:var(--cyan)">×2</b> gates to grow the crowd, blast the crimson horde, and shatter the golden scorpion into a rain of coins.</p>
      <button class="btn" id="playBtn">TAP TO PLAY</button>
      <button class="btn ghost" id="demoBtn">▶ AUTO DEMO (for recording)</button>
      <div class="hint">Drag / move left & right to steer · A · D · ← →</div>
    </div>

    <div class="screen" id="overScreen" hidden>
      <div class="kicker" id="overKick">Squad Wiped</div>
      <h1 class="title" id="overTitle" style="font-size:clamp(34px,10vw,58px)">RUN OVER</h1>
      <div class="stat">
        <div><b id="fDist">0</b><span>Meters</span></div>
        <div><b id="fCoins">0</b><span>Coins</span></div>
        <div><b id="fWave">0</b><span>Bosses</span></div>
      </div>
      <button class="btn" id="retryBtn">PLAY AGAIN</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('startScreen').innerHTML='<p class="sub">Could not load the 3D engine. Check your connection and reopen.</p>';return;}
var T=THREE;

/* ---------- palette ---------- */
var C={ sky:0xe0a15a, fog:0xdf9a54, sand:0xd9a85e,
  cliffA:0xa9502f, cliffB:0x7e3722, cliffLt:0xc56b3a,
  cyan:0x2fe6f6, cyanEm:0x12c4e0, red:0xf03a44, redEm:0xa81622,
  gold:0xf2c247, goldDk:0xb8862a, boss:0xe9b63c };

/* ---------- world constants ---------- */
var PATH=4.4;               // half-width of runnable path
var SPEED=23;               // base forward speed (units/s)
var speed=SPEED;
var SPAWN_Z=-118;           // where things appear
var frameEl=document.getElementById('frame');

/* ---------- renderer / scene / camera ---------- */
var renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.06;
frameEl.appendChild(renderer.domElement);

var scene=new T.Scene();
scene.background=new T.Color(C.sky);
scene.fog=new T.Fog(C.fog,26,120);

var camera=new T.PerspectiveCamera(62,0.5625,0.1,600);
var camBase=new T.Vector3(0,6.1,9.2);
camera.position.copy(camBase);

function resize(){
  var w=frameEl.clientWidth,h=frameEl.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);

/* ---------- lights ---------- */
scene.add(new T.HemisphereLight(0xffe6c0,0x6b3a1e,0.85));
var sun=new T.DirectionalLight(0xfff0d0,1.55);
sun.position.set(-9,16,6); scene.add(sun);
var rim=new T.DirectionalLight(0x8fdcff,0.35);
rim.position.set(6,8,-10); scene.add(rim);

/* ---------- helpers ---------- */
function rnd(a,b){return a+Math.random()*(b-a);}
function label(text,bg,fg){
  var c=document.createElement('canvas');c.width=c.height=256;
  var x=c.getContext('2d');
  x.fillStyle=bg;x.fillRect(0,0,256,256);
  x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=10;x.strokeRect(12,12,232,232);
  x.fillStyle=fg;x.font='bold 150px Fredoka, Arial';x.textAlign='center';x.textBaseline='middle';
  x.fillText(text,128,138);
  var tex=new T.CanvasTexture(c);tex.anisotropy=4;return tex;
}
function groundTex(){
  var c=document.createElement('canvas');c.width=c.height=128;var x=c.getContext('2d');
  x.fillStyle='#d9a85e';x.fillRect(0,0,128,128);
  for(var i=0;i<420;i++){x.fillStyle='rgba(120,70,30,'+rnd(.03,.12)+')';var s=rnd(1,3);x.fillRect(rnd(0,128),rnd(0,128),s,s);}
  x.strokeStyle='rgba(150,95,45,.25)';x.lineWidth=2;x.beginPath();x.moveTo(0,64);x.lineTo(128,64);x.stroke();
  var t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(6,30);return t;
}
function strataTex(){
  var c=document.createElement('canvas');c.width=64;c.height=256;var x=c.getContext('2d');
  var cols=['#b4553a','#9d4630','#c56b3a','#8a3c26','#a95230','#7e3722'];
  var y=0;while(y<256){var h=rnd(8,26);x.fillStyle=cols[(Math.random()*cols.length)|0];x.fillRect(0,y,64,h);
    x.fillStyle='rgba(60,25,12,.25)';x.fillRect(0,y+h-2,64,2);y+=h;}
  var t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(1,6);return t;
}

/* ---------- ground & walls ---------- */
var gTex=groundTex();
var ground=new T.Mesh(new T.PlaneGeometry(60,420),
  new T.MeshStandardMaterial({map:gTex,roughness:1,metalness:0}));
ground.rotation.x=-Math.PI/2; ground.position.z=-160; scene.add(ground);

var strata=strataTex();
function wall(sign){
  var g=new T.Mesh(new T.BoxGeometry(6,34,420),
    new T.MeshStandardMaterial({map:strata,roughness:1,metalness:0,color:C.cliffLt}));
  g.position.set(sign*(PATH+4.2),13,-160); scene.add(g);
  // jagged top boulders
  for(var i=0;i<26;i++){
    var b=new T.Mesh(new T.BoxGeometry(rnd(2,4),rnd(2,6),rnd(3,7)),
      new T.MeshStandardMaterial({color:i%2?C.cliffA:C.cliffB,roughness:1}));
    b.position.set(sign*(PATH+rnd(2.5,5.5)),rnd(26,32),-320+i*13);
    b.rotation.y=rnd(0,1); scene.add(b);
  }
  return g;
}
wall(-1); wall(1);

/* ---------- scrolling decor (rungs + arches) ---------- */
var rungs=[],RUNG_N=26,RUNG_GAP=6;
for(var i=0;i<RUNG_N;i++){
  var r=new T.Mesh(new T.BoxGeometry(PATH*2+0.4,0.08,0.5),
    new T.MeshStandardMaterial({color:0xb07a3c,roughness:1,transparent:true,opacity:.5}));
  r.position.set(0,0.04,10-i*RUNG_GAP); scene.add(r); rungs.push(r);
}
var arches=[],ARCH_N=4,ARCH_GAP=42;
function makeArch(z){
  var g=new T.Group();
  var matA=new T.MeshStandardMaterial({color:C.cliffA,roughness:1});
  var top=new T.Mesh(new T.BoxGeometry(PATH*2+9,2.4,4),matA); top.position.y=12.2; g.add(top);
  var pL=new T.Mesh(new T.BoxGeometry(3,12,4),matA); pL.position.set(-(PATH+4),6,0); g.add(pL);
  var pR=pL.clone(); pR.position.x=(PATH+4); g.add(pR);
  var arc=new T.Mesh(new T.TorusGeometry(PATH+1.6,0.9,8,20,Math.PI),
    new T.MeshStandardMaterial({color:C.cliffB,roughness:1}));
  arc.position.y=11; g.add(arc);
  g.position.z=z; scene.add(g); return g;
}
for(var i=0;i<ARCH_N;i++) arches.push(makeArch(-40-i*ARCH_GAP));

/* ---------- dust motes / god-ray glow ---------- */
(function(){
  var geo=new T.BufferGeometry(),n=140,pos=new Float32Array(n*3);
  for(var i=0;i<n;i++){pos[i*3]=rnd(-14,14);pos[i*3+1]=rnd(1,22);pos[i*3+2]=rnd(-120,10);}
  geo.setAttribute('position',new T.BufferAttribute(pos,3));
  var m=new T.PointsMaterial({color:0xffe6b0,size:0.14,transparent:true,opacity:.5,depthWrite:false});
  var pts=new T.Points(geo,m); scene.add(pts); window.__dust=pts;
})();

/* ---------- soldier factory ---------- */
function soldier(hostile){
  var g=new T.Group();
  var body=hostile?C.red:0x2aa9c4, em=hostile?C.redEm:C.cyanEm;
  var mat=new T.MeshStandardMaterial({color:body,emissive:em,emissiveIntensity:.5,roughness:.45,metalness:.35});
  var torso=new T.Mesh(new T.BoxGeometry(0.62,0.72,0.42),mat); torso.position.y=1.02; g.add(torso);
  var hips=new T.Mesh(new T.BoxGeometry(0.5,0.4,0.4),mat); hips.position.y=0.55; g.add(hips);
  var lL=new T.Mesh(new T.BoxGeometry(0.2,0.55,0.22),mat); lL.position.set(-0.16,0.28,0); g.add(lL);
  var rL=lL.clone(); rL.position.x=0.16; g.add(rL);
  var head=new T.Mesh(new T.SphereGeometry(0.28,12,10),
    new T.MeshStandardMaterial({color:body,emissive:em,emissiveIntensity:.35,roughness:.35,metalness:.4}));
  head.position.y=1.62; head.scale.set(1,.92,1.05); g.add(head);
  var visor=new T.Mesh(new T.BoxGeometry(0.3,0.08,0.06),
    new T.MeshStandardMaterial({color:0x001015,emissive:hostile?0xff5a4a:0x4ff6ff,emissiveIntensity:2.2}));
  visor.position.set(0,1.63,0.25); g.add(visor);
  var gun=new T.Mesh(new T.BoxGeometry(0.14,0.14,0.7),
    new T.MeshStandardMaterial({color:0x223,emissive:hostile?C.redEm:C.cyanEm,emissiveIntensity:.7,metalness:.6,roughness:.3}));
  gun.position.set(0.24,1.0,0.34); g.add(gun);
  g.userData={leg:lL,leg2:rL,ph:Math.random()*6.28};
  return g;
}

/* ---------- player crowd ---------- */
var crowd=1, centerX=0, targetX=0;
var MAXR=64;                       // max rendered soldiers
var squad=[]; var squadRoot=new T.Group(); scene.add(squadRoot);
function ensureSoldiers(n){
  n=Math.min(n,MAXR);
  while(squad.length<n){var s=soldier(false);squadRoot.add(s);squad.push(s);}
  while(squad.length>n){var s=squad.pop();squadRoot.remove(s);}
}
function formSlots(n){
  var cols=Math.max(1,Math.min(9,Math.ceil(Math.sqrt(n))));
  var sp=0.82;
  return {cols:cols,sp:sp};
}

/* ---------- gates ---------- */
var gates=[]; // {group, side operations}
var GATE_OPS=[
  {t:'×2',f:function(c){return c*2;},good:1},
  {t:'×3',f:function(c){return c*3;},good:1},
  {t:'+15',f:function(c){return c+15;},good:1},
  {t:'+25',f:function(c){return c+25;},good:1},
  {t:'−10',f:function(c){return c-10;},good:0},
  {t:'÷2',f:function(c){return Math.floor(c/2);},good:0}
];
function pickPair(){
  // one attractive, one weaker/risky
  var good=GATE_OPS[(Math.random()*4)|0];
  var other=GATE_OPS[(Math.random()*GATE_OPS.length)|0];
  var arr=[good,other]; if(Math.random()<.5) arr.reverse(); return arr;
}
function gatePanel(op){
  var g=new T.Group();
  var col=op.good?C.cyan:C.red;
  var glass=new T.Mesh(new T.PlaneGeometry(PATH-0.15,6.4),
    new T.MeshBasicMaterial({color:col,transparent:true,opacity:.22,side:T.DoubleSide,depthWrite:false}));
  glass.position.y=3.2; g.add(glass);
  var frame=new T.Mesh(new T.PlaneGeometry(PATH-0.05,6.6),
    new T.MeshBasicMaterial({color:col,transparent:true,opacity:.5,wireframe:true,depthWrite:false}));
  frame.position.y=3.2; g.add(frame);
  var lab=new T.Mesh(new T.PlaneGeometry(2.4,2.4),
    new T.MeshBasicMaterial({map:label(op.t,op.good?'rgba(6,60,72,.85)':'rgba(70,10,14,.85)','#ffffff'),
      transparent:true,depthWrite:false}));
  lab.position.set(0,3.4,0.1); g.add(lab);
  g.userData.op=op;
  return g;
}
function spawnGate(z){
  var pair=pickPair();
  var grp=new T.Group();
  var L=gatePanel(pair[0]); L.position.x=-PATH/2; grp.add(L);
  var R=gatePanel(pair[1]); R.position.x= PATH/2; grp.add(R);
  var post=new T.Mesh(new T.BoxGeometry(0.14,6.6,0.14),
    new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55}));
  post.position.y=3.2; grp.add(post);
  grp.position.z=z; grp.userData={left:pair[0],right:pair[1],done:false};
  scene.add(grp); gates.push(grp);
}

/* ---------- enemies ---------- */
var enemies=[];
function spawnWave(z,count){
  for(var i=0;i<count;i++){
    var e=soldier(true);
    e.position.set(rnd(-PATH+0.4,PATH-0.4),0,z-rnd(0,10));
    e.userData.ph=Math.random()*6.28;
    scene.add(e); enemies.push(e);
  }
}

/* ---------- boss ---------- */
var boss=null;
function spawnBoss(hp){
  var g=new T.Group();
  var gm=new T.MeshStandardMaterial({color:C.boss,emissive:0x3a2600,emissiveIntensity:.4,metalness:.85,roughness:.28});
  var body=new T.Mesh(new T.SphereGeometry(2.1,20,16),gm); body.scale.set(1.5,1,1.9); body.position.y=2; g.add(body);
  var head=new T.Mesh(new T.SphereGeometry(1.2,16,12),gm); head.position.set(0,1.8,-3); g.add(head);
  // eyes
  var eyeM=new T.MeshStandardMaterial({color:0x100,emissive:0xff7b1e,emissiveIntensity:3});
  var e1=new T.Mesh(new T.SphereGeometry(0.18,8,8),eyeM); e1.position.set(-0.4,2.2,-3.9); g.add(e1);
  var e2=e1.clone(); e2.position.x=0.4; g.add(e2);
  // pincers
  var pincers=[];
  [-1,1].forEach(function(s){
    var arm=new T.Mesh(new T.BoxGeometry(0.6,0.6,2.4),gm); arm.position.set(s*1.7,1.6,-3.4); arm.rotation.y=s*0.4; g.add(arm);
    var claw=new T.Mesh(new T.ConeGeometry(0.55,1.6,6),gm); claw.rotation.x=-Math.PI/2; claw.position.set(s*2.4,1.6,-4.7); g.add(claw);
    pincers.push(claw);
  });
  // legs
  [-1,1].forEach(function(s){for(var i=0;i<4;i++){
    var leg=new T.Mesh(new T.CylinderGeometry(0.14,0.1,2.6,6),gm);
    leg.position.set(s*2.1,1.3,-1.5+i*1.1); leg.rotation.z=s*0.9; g.add(leg);}});
  // tail
  var tail=new T.Group(); var seg=body;
  for(var i=0;i<6;i++){
    var sg=new T.Mesh(new T.SphereGeometry(1.05-i*0.13,12,10),gm);
    sg.position.set(0,2+i*0.55,3+i*0.5); tail.add(sg);
  }
  var sting=new T.Mesh(new T.ConeGeometry(0.5,1.8,8),
    new T.MeshStandardMaterial({color:C.boss,emissive:0xff7b1e,emissiveIntensity:1.6,metalness:.8,roughness:.3}));
  sting.position.set(0,5.5,6.4); sting.rotation.x=-0.7; tail.add(sting);
  g.add(tail);
  g.position.set(0,0,SPAWN_Z-6); g.scale.setScalar(1.25);
  g.userData={hp:hp,maxhp:hp,pincers:pincers,tail:tail,t:0,dead:false,held:false};
  scene.add(g); boss=g;
  bossWrap.classList.add('show');
}

/* ---------- lasers ---------- */
var lasers=[],laserPool=[];
var laserGeo=new T.BoxGeometry(0.12,0.12,1.5);
var laserMat=new T.MeshBasicMaterial({color:0x9ff6ff});
function fireLaser(x,y,z){
  var m=laserPool.pop();
  if(!m){m=new T.Mesh(laserGeo,laserMat);}
  m.position.set(x,y,z); m.visible=true; scene.add(m); lasers.push(m);
}
function killLaser(idx){var m=lasers[idx];m.visible=false;scene.remove(m);laserPool.push(m);lasers.splice(idx,1);}

/* ---------- particles (sparks + coins) ---------- */
var parts=[],partPool=[];
var sparkGeo=new T.SphereGeometry(0.16,6,6);
function spark(pos,color,n,spd){
  for(var i=0;i<n;i++){
    var m=partPool.pop();
    if(!m){m=new T.Mesh(sparkGeo,new T.MeshBasicMaterial());}
    m.material.color.setHex(color); m.visible=true; m.scale.setScalar(1);
    m.position.copy(pos);
    m.userData={vx:rnd(-spd,spd),vy:rnd(spd*.4,spd),vz:rnd(-spd,spd),life:rnd(.4,.8),coin:false,age:0};
    scene.add(m); parts.push(m);
  }
}
var coinGeo=new T.CylinderGeometry(0.28,0.28,0.09,12);
function coinBurst(pos,n){
  for(var i=0;i<n;i++){
    var m=partPool.pop();
    if(!m||!m.userData||m.geometry!==coinGeo){ m=new T.Mesh(coinGeo,new T.MeshStandardMaterial({color:C.gold,emissive:C.goldDk,emissiveIntensity:.5,metalness:.9,roughness:.25})); }
    m.visible=true; m.scale.setScalar(rnd(.7,1.1));
    m.position.set(pos.x+rnd(-1,1),pos.y+rnd(0,2),pos.z+rnd(-1,1));
    m.userData={vx:rnd(-7,7),vy:rnd(6,12),vz:rnd(-4,9),life:rnd(1.1,1.8),coin:true,age:0,spin:rnd(6,16)};
    scene.add(m); parts.push(m);
  }
}
function killPart(idx){var m=parts[idx];m.visible=false;scene.remove(m);
  if(m.geometry===coinGeo)coinPool.push(m); else partPool.push(m); parts.splice(idx,1);}
var coinPool=[];
// simpler: keep separate pools by geometry
function releasePart(m){m.visible=false;scene.remove(m); if(m.geometry===coinGeo)coinPool.push(m); else partPool.push(m);}

/* fix coinBurst to use coinPool */
coinBurst=function(pos,n){
  for(var i=0;i<n;i++){
    var m=coinPool.pop();
    if(!m){m=new T.Mesh(coinGeo,new T.MeshStandardMaterial({color:C.gold,emissive:C.goldDk,emissiveIntensity:.5,metalness:.9,roughness:.25}));}
    m.visible=true; m.scale.setScalar(rnd(.7,1.1));
    m.position.set(pos.x+rnd(-1.5,1.5),pos.y+rnd(0,2.5),pos.z+rnd(-1.5,1.5));
    m.rotation.set(rnd(0,6),rnd(0,6),rnd(0,6));
    m.userData={vx:rnd(-8,8),vy:rnd(7,13),vz:rnd(-5,10),life:rnd(1.2,2),coin:true,age:0,spin:rnd(8,18)};
    scene.add(m); parts.push(m);
  }
};

/* ---------- HUD refs ---------- */
var crowdEl=document.getElementById('crowd'),coinsEl=document.getElementById('coins'),
    distEl=document.getElementById('dist'),bossWrap=document.getElementById('bossWrap'),
    bossBar=document.getElementById('bossBar'),bossPct=document.getElementById('bossPct'),
    toastEl=document.getElementById('toast'),autoBtn=document.getElementById('autoBtn');
var coins=0,dist=0,bosses=0,state='menu',auto=false,shake=0;
var nextGate=34,nextWave=60,nextBoss=300,waveGap=110,bossGap=360;

function toast(msg){
  toastEl.textContent=msg; toastEl.style.transition='none';
  toastEl.style.opacity='0';toastEl.style.transform='translate(-50%,-50%) scale(.6)';
  requestAnimationFrame(function(){toastEl.style.transition='transform .5s cubic-bezier(.2,1.4,.4,1),opacity .5s';
    toastEl.style.opacity='1';toastEl.style.transform='translate(-50%,-50%) scale(1)';
    setTimeout(function(){toastEl.style.opacity='0';toastEl.style.transform='translate(-50%,-50%) scale(1.3)';},650);});
}
function setCrowd(n){crowd=Math.max(0,Math.min(400,Math.round(n)));crowdEl.textContent=crowd;ensureSoldiers(crowd);}

/* ---------- game control ---------- */
function reset(demo){
  // clear dynamic objects
  gates.forEach(function(g){scene.remove(g);}); gates=[];
  enemies.forEach(function(e){scene.remove(e);}); enemies=[];
  lasers.slice().forEach(function(_,i){killLaser(0);});
  parts.slice().forEach(function(m){releasePart(m);}); parts=[];
  if(boss){scene.remove(boss);boss=null;} bossWrap.classList.remove('show');
  coins=0;dist=0;bosses=0;speed=SPEED;centerX=0;targetX=0;shake=0;
  nextGate=34;nextWave=64;nextBoss=300;bossGap=360;
  coinsEl.textContent='0';distEl.textContent='0';
  setCrowd(1);
  auto=!!demo; autoBtn.classList.toggle('on',auto); autoBtn.setAttribute('aria-pressed',auto);
  state='playing';
  document.getElementById('startScreen').hidden=true;
  document.getElementById('overScreen').hidden=true;
}
function gameOver(){
  state='over';
  document.getElementById('fDist').textContent=Math.floor(dist);
  document.getElementById('fCoins').textContent=coins;
  document.getElementById('fWave').textContent=bosses;
  document.getElementById('overScreen').hidden=false;
}
document.getElementById('playBtn').onclick=function(){reset(false);};
document.getElementById('demoBtn').onclick=function(){reset(true);};
document.getElementById('retryBtn').onclick=function(){reset(auto);};
autoBtn.onclick=function(){auto=!auto;autoBtn.classList.toggle('on',auto);autoBtn.setAttribute('aria-pressed',auto);};

/* ---------- input ---------- */
var dragging=false;
function ptrX(clientX){
  var r=renderer.domElement.getBoundingClientRect();
  var f=(clientX-r.left)/r.width; return (f*2-1)*PATH;
}
renderer.domElement.addEventListener('pointerdown',function(e){dragging=true;auto=false;autoBtn.classList.remove('on');targetX=ptrX(e.clientX);});
window.addEventListener('pointermove',function(e){if(dragging)targetX=ptrX(e.clientX);});
window.addEventListener('pointerup',function(){dragging=false;});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){auto=false;autoBtn.classList.remove('on');targetX=Math.max(-PATH,targetX-1.4);}
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){auto=false;autoBtn.classList.remove('on');targetX=Math.min(PATH,targetX+1.4);}
});

/* ---------- AI (auto demo) ---------- */
function autoSteer(){
  if(boss){targetX=0;return;}
  // nearest upcoming gate
  var best=null,bz=-999;
  for(var i=0;i<gates.length;i++){var g=gates[i];if(!g.userData.done&&g.position.z<0&&g.position.z>bz){bz=g.position.z;best=g;}}
  if(best){
    var lv=best.userData.left.f(crowd), rv=best.userData.right.f(crowd);
    targetX=(lv>=rv?-PATH/2:PATH/2);
  } else { targetX=0; }
}

/* ---------- main loop ---------- */
var clock=new T.Clock();
function tick(){
  requestAnimationFrame(tick);
  var dt=Math.min(clock.getDelta(),0.045);
  var tsec=clock.elapsedTime;

  // dust drift
  if(window.__dust){window.__dust.rotation.y+=dt*0.02;}

  if(state==='playing'){
    if(auto) autoSteer();
    dist+=speed*dt; distEl.textContent=Math.floor(dist);

    // steer
    centerX+=(targetX-centerX)*Math.min(1,dt*9);
    centerX=Math.max(-PATH,Math.min(PATH,centerX));

    // scroll decor
    for(var i=0;i<rungs.length;i++){var r=rungs[i];r.position.z+=speed*dt;if(r.position.z>11)r.position.z-=RUNG_N*RUNG_GAP;}
    for(var i=0;i<arches.length;i++){var a=arches[i];a.position.z+=speed*dt;if(a.position.z>16)a.position.z-=ARCH_N*ARCH_GAP;}
    if(gTex)gTex.offset.y-=speed*dt*0.03;
    if(strata)strata.offset.y-=speed*dt*0.006;

    // spawns
    if(!boss){
      if(dist>=nextGate){spawnGate(SPAWN_Z);nextGate+=rnd(70,86);}
      if(dist>=nextWave){spawnWave(SPAWN_Z-6,4+Math.min(18,(bosses*3)|0)+((Math.random()*4)|0));nextWave+=waveGap;}
      if(dist>=nextBoss){spawnBoss(150+bosses*90);}
    }

    // --- squad formation ---
    var n=Math.min(crowd,MAXR);
    var fs=formSlots(n);
    for(var i=0;i<squad.length;i++){
      var s=squad[i];
      var col=i%fs.cols, row=(i/fs.cols)|0;
      var sx=centerX+(col-(fs.cols-1)/2)*fs.sp;
      var sz=row*fs.sp*1.05;
      s.position.x+=(sx-s.position.x)*Math.min(1,dt*10);
      s.position.z+=(sz-s.position.z)*Math.min(1,dt*10);
      // run bob
      var ph=tsec*11+s.userData.ph;
      s.position.y=Math.abs(Math.sin(ph))*0.13;
      if(s.userData.leg){s.userData.leg.rotation.x=Math.sin(ph)*0.7;s.userData.leg2.rotation.x=-Math.sin(ph)*0.7;}
    }

    // --- firing ---
    fireAcc+=dt;
    var rate=Math.max(0.05, 1/Math.min(90,6+crowd*2.4));
    while(fireAcc>rate && squad.length){
      fireAcc-=rate;
      var s=squad[(Math.random()*Math.min(squad.length,fs.cols*2))|0]||squad[0];
      fireLaser(s.position.x,1.05,s.position.z-0.4);
    }

    // --- lasers ---
    for(var i=lasers.length-1;i>=0;i--){
      var m=lasers[i]; m.position.z-=68*dt;
      if(m.position.z<SPAWN_Z-8){killLaser(i);continue;}
      var hit=false;
      // boss
      if(boss&&!boss.userData.dead&&m.position.z<boss.position.z+2.4&&Math.abs(m.position.x-boss.position.x)<3.4){
        boss.userData.hp-=1; spark(m.position,0xffd36b,3,5); killLaser(i);
        var p=Math.max(0,boss.userData.hp/boss.userData.maxhp);
        bossBar.style.width=(p*100)+'%'; bossPct.textContent=Math.ceil(p*100)+'%';
        if(boss.userData.hp<=0) bossDie();
        continue;
      }
      for(var j=enemies.length-1;j>=0;j--){
        var e=enemies[j];
        if(Math.abs(m.position.z-e.position.z)<1.1 && Math.abs(m.position.x-e.position.x)<0.7){
          spark(e.position,C.red,6,6); scene.remove(e); enemies.splice(j,1);
          killLaser(i); hit=true; if(Math.random()<0.25) coinBurst(e.position,2); break;
        }
      }
      if(hit)continue;
    }

    // --- enemies advance ---
    for(var j=enemies.length-1;j>=0;j--){
      var e=enemies[j]; e.position.z+=(speed+6)*dt;
      var ph=tsec*11+e.userData.ph; e.position.y=Math.abs(Math.sin(ph))*0.12;
      if(e.userData.leg){e.userData.leg.rotation.x=Math.sin(ph)*0.7;e.userData.leg2.rotation.x=-Math.sin(ph)*0.7;}
      if(e.position.z>1.2){ // reached the squad line
        scene.remove(e); enemies.splice(j,1);
        setCrowd(crowd-1); spark(new T.Vector3(e.position.x,1,0.5),0xffffff,5,5); shake=Math.max(shake,0.25);
        if(crowd<=0){gameOver();}
      }
    }

    // --- gates ---
    for(var i=gates.length-1;i>=0;i--){
      var g=gates[i]; g.position.z+=speed*dt;
      if(!g.userData.done && g.position.z>0.2){
        g.userData.done=true;
        var op=(centerX<0)?g.userData.left:g.userData.right;
        var before=crowd; setCrowd(op.f(crowd));
        toast(op.t+'  ·  '+crowd);
        if(op.good&&crowd>before) shake=Math.max(shake,0.18);
        if(crowd<=0){gameOver();}
      }
      if(g.position.z>12){scene.remove(g);gates.splice(i,1);}
    }

    // --- boss ---
    if(boss&&!boss.userData.dead){
      var b=boss.userData; b.t+=dt;
      if(boss.position.z< -18){ boss.position.z+=speed*dt*0.6; }
      else { b.held=true; boss.position.z+= Math.sin(b.t)*0.4*dt; }
      boss.rotation.y=Math.sin(b.t*0.8)*0.08;
      b.tail.rotation.x=Math.sin(b.t*1.6)*0.12-0.05;
      b.pincers[0].rotation.z=Math.sin(b.t*3)*0.3;
      b.pincers[1].rotation.z=-Math.sin(b.t*3)*0.3;
    }

    // --- particles ---
    for(var i=parts.length-1;i>=0;i--){
      var m=parts[i],u=m.userData; u.age+=dt;
      u.vy-=(u.coin?24:14)*dt;
      m.position.x+=u.vx*dt; m.position.y+=u.vy*dt; m.position.z+=(u.vz+speed)*dt;
      if(u.coin){m.rotation.x+=u.spin*dt;m.rotation.z+=u.spin*0.6*dt;
        if(m.position.y<0.2&&u.vy<0){m.position.y=0.2;u.vy*=-0.4;u.vx*=.6;u.vz*=.6;}}
      if(u.age>u.life){
        if(u.coin){coins++;coinsEl.textContent=coins;}
        releasePart(m); parts.splice(i,1); continue;
      }
      if(u.age>u.life-0.3){var k=(u.life-u.age)/0.3;m.scale.setScalar((u.coin?1:1)*Math.max(0.01,k));}
    }

    // --- camera shake ---
    shake*=Math.pow(0.0001,dt);
    camera.position.set(camBase.x+rnd(-shake,shake), camBase.y+rnd(-shake,shake), camBase.z);
    camera.position.x+=centerX*0.12;
    camera.lookAt(centerX*0.3,1.4,-6);
  }

  renderer.render(scene,camera);
}
var fireAcc=0;

function bossDie(){
  if(!boss)return; var b=boss.userData; b.dead=true; bosses++;
  shake=1.6;
  // shatter into coins
  var origin=boss.position.clone(); origin.y=2;
  var burst=0; var iv=setInterval(function(){
    coinBurst(new T.Vector3(origin.x+rnd(-3,3),origin.y+rnd(0,3),origin.z+rnd(-2,2)),22);
    spark(new T.Vector3(origin.x+rnd(-3,3),origin.y+rnd(0,4),origin.z),0xffd36b,4,8);
    burst++; if(burst>7)clearInterval(iv);
  },90);
  toast('CLEARED!');
  scene.remove(boss); boss=null;
  bossWrap.classList.remove('show');
  // continue harder
  speed=SPEED+bosses*2.2;
  nextGate=dist+40; nextWave=dist+70; nextBoss=dist+bossGap; bossGap+=40;
}

/* ---------- go ---------- */
ensureSoldiers(1);
resize();
tick();
})();
</script>
