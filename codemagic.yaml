# Codemagic CI/CD — builds the iOS app on a cloud Mac and ships it to TestFlight.
# No local Mac required. You configure the App Store Connect API key + signing in the
# Codemagic UI (see CHECKLIST.md, "Part C"), then the values below wire it together.

workflows:
  ios-release:
    name: Canyon Clash iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Name of the App Store Connect API key you add in Codemagic:
      #   Teams > (personal) > Integrations > Developer Portal / App Store Connect
      app_store_connect: CanyonClash ASC Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jarvis.canyonclash
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.jarvis.canyonclash"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync web assets into the iOS project
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Leave beta_groups empty until you create a TestFlight group in App Store Connect.
        # beta_groups:
        #   - Internal Testers
